# Railway configuration for motorove monorepo
# This file should be at the repository root

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/backend/Dockerfile"
# Build the staging target
buildTarget = "staging"

[deploy]
# Let Dockerfile handle the startup command
healthcheckPath = "/api"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

