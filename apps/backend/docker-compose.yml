services:
  # PostgreSQL Database (Optional - only if not using Supabase)
  # Uncomment this service if you want to use a local PostgreSQL database
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: motorove-postgres
  #   ports:
  #     - '${DB_PORT:-5432}:5432'
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     POSTGRES_DB: ${POSTGRES_DB:-motorove}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - motorove-network
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U postgres']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # API - Development environment
  api-dev:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: motorove-api-dev
    ports:
      - '${DEV_PORT:-3000}:3000'
    environment:
      - NODE_ENV=development
    env_file:
      - .env.dev
    volumes:
      - ../../shared:/app/shared
      - .:/app/apps/backend
      - /app/apps/backend/node_modules
      - /app/node_modules
    # Remove depends_on since we're using Supabase
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    networks:
      - motorove-network

  # API - Staging environment
  api-staging:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: staging
    container_name: motorove-api-staging
    ports:
      - '${STAGING_PORT:-3000}:3000'
    environment:
      - NODE_ENV=staging
    env_file:
      - .env.staging
    volumes:
      - ../../shared:/app/shared
      - .:/app/apps/backend
      - /app/apps/backend/node_modules
      - /app/node_modules
    # Remove depends_on since we're using Supabase
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    networks:
      - motorove-network

  # API - Production environment
  api-prod:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: motorove-api-prod
    ports:
      - '${PROD_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    # Remove depends_on since we're using Supabase
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    networks:
      - motorove-network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  motorove-network:
    driver: bridge
# Volumes (only needed if using local PostgreSQL)
# volumes:
#   postgres_data:
