  createdBy: User!
  createdById: String!
  id: ID!
  isActive: Boolean!
  platform: SocialMediaPlatform!
  updatedAt: DateTime!
  updatedBy: User!
  updatedById: String!
  url: String!
  username: String!
}

"""Social media platform types"""
enum SocialMediaPlatform {
  FACEBOOK
  INSTAGRAM
  LINKEDIN
  TIKTOK
  TWITTER
  YOUTUBE
}

"""Different categories of support requests"""
enum SupportCategory {
  ACCOUNT
  BUG_REPORT
  FEATURE_REQUEST
  FEEDBACK
  OTHER
  TECHNICAL
}

input UpdateAddressInput {
  address: String
  eventId: String
  id: String!
  language: Language
  latitude: Float
  longitude: Float
  postId: String
  type: AddressType
}

input UpdateBusinessCommentInput {
  content: String
  id: ID!
  rating: Int
}

input UpdateEventInput {
  addresses: [CreateAddressInput!]
  campingInfo: String
  currency: String
  description: String
  difficultyLevel: String
  endDateTime: String
  equipmentChecklist: String
  eventType: EventType
  experienceLevel: String
  id: String!
  images: [String!]
  instructorInfo: String
  invitedGroupIds: [String!]
  invitedUserIds: [String!]
  isPrivate: Boolean = false
  maxParticipants: Int
  organizedByGroupId: String
  price: String
  restStops: String
  roadType: String
  routeDescription: String
  startDateTime: String
  status: EventStatus
  title: String
  topicsCovered: String
}

input UpdateGroupInput {
  cityId: String
  cover: String
  description: String
  id: ID!
  logo: String
  membersCapacity: Int
  name: String
  privacy: GroupPrivacy
  tags: [GroupTag!]
}

input UpdateGroupMembershipApprovalStatusInput {
  id: ID!
  status: ApprovalStatus!
}

input UpdatePasswordInput {
  email: String!
  password: String!
  token: String!
}

input UpdatePostCommentInput {
  content: String
  id: ID!
}

input UpdatePostInput {
  addresses: [CreateAddressInput!]
  content: String
  groupId: String
  id: ID!
  images: [String!]
}

input UpdateUserFollowingApprovalStatusInput {
  id: ID!
  status: ApprovalStatus!
}

input UpdateUserSettingInput {
  autoAcceptFollowers: Boolean
  notificationPermission: NotificationPermission
  notificationPreferences: JSON
  preferredLanguage: Language
}

type User {
  avatar: String
  bio: String
  city: City!
  cityId: String
  createdAt: DateTime!
  createdEventInvitations: [EventInvitation!]
  createdGroups: [Group!]
  dateOfBirth: DateTime
  email: String!
  eventParticipations: [EventParticipant!]
  firstName: String!
  followers: [UserFollowing!]
  following: [UserFollowing!]
  garages: [Garage!]
  gender: Gender
  groupMemberships: [GroupMembership!]
  hasCompletedSetup: Boolean!
  id: ID!
  interests: [Interest!]
  isActive: Boolean!
  lastName: String!
  notifications: [Notification!]
  postComments: [PostComment!]
  postLikes: [PostLike!]
  postSaves: [PostSave!]
  posts: [Post!]
  receivedInvitations: [EventInvitation!]
  ridingStyles: [RidingStyle!]
  socialMediaProfiles: [SocialMedia!]
  supabaseId: String!
  updatedAt: DateTime!
  userSetting: UserSetting
}

type UserDto {
  avatar: String
  city: CityDto
  email: String!
  firstName: String!
  followingStatus: ApprovalStatus
  id: ID!
  lastName: String!
  supabaseId: String!
}

type UserFollowing {
  createdAt: DateTime!
  follower: User!
  followerId: String!
  following: User!
  followingId: String!
  id: ID!
  isActive: Boolean!
  status: String!
  updatedAt: DateTime!
}

type UserFollowingDto {
  createdAt: DateTime!
  follower: UserDto
  following: UserDto
  id: ID!
  status: String!
  updatedAt: DateTime!
}

type UserSetting {
  autoAcceptFollowers: Boolean!
  createdAt: DateTime!
  id: ID!
  notificationPermission: NotificationPermission!
  notificationPreferences: JSON
  preferredLanguage: Language!
  updatedAt: DateTime!
  user: User!
  userId: ID!
}

type UserSettingDto {
  autoAcceptFollowers: Boolean!
  notificationPermission: NotificationPermission!
  notificationPreferences: JSON
  preferredLanguage: Language!
}

type WarningAddressDto {
  address: String!
  country: String
  id: ID!
  language: Language!
  latitude: Float!
  longitude: Float!
}

type WarningDescriptionDto {
  description: String!
  id: ID!
  language: Language!
}

type WarningDto {
  addresses: [WarningAddressDto!]!
  createdAt: DateTime!
  createdBy: UserDto!
  createdById: String!
  descriptions: [WarningDescriptionDto!]
  id: ID!
  isActive: Boolean!
  status: ApprovalStatus!
  type: WarningType!
  updatedAt: DateTime!
  updatedBy: UserDto!
  updatedById: String!
}

"""Type of warning for motorcycle rides"""
enum WarningType {
  ACCIDENT
  DANGEROUS_CURVE
  OTHER
  PARKING_PROHIBITED
  POLICE_CHECKPOINT
  RADAR
  ROAD_CLOSURE
  ROAD_CONSTRUCTION
  SLIPPERY_ROAD
}

type Weather {
  cityId: String!
  cityName: String!
  condition: WeatherCondition!
  temperature: Float!
}

"""Weather conditions"""
enum WeatherCondition {
  CLEAR
  CLOUDY
  DRIZZLE
  FLURRIES
  FOG
  FREEZING_DRIZZLE
  FREEZING_RAIN
  HAIL
  HEAVY_FREEZING_RAIN
  HEAVY_ICE_PELLETS
  HEAVY_RAIN
  HEAVY_SNOW
  HURRICANE
  ICE_PELLETS
  LIGHT_FOG
  LIGHT_FREEZING_RAIN
  LIGHT_ICE_PELLETS
  LIGHT_RAIN
  LIGHT_SNOW
  LIGHT_WIND
  MOSTLY_CLEAR
  MOSTLY_CLOUDY
  PARTLY_CLOUDY
  RAIN
  SNOW
  STRONG_WIND
  THUNDERSTORM
  TORNADO
  UNKNOWN
  WIND
}

type WorkingHourDto {
  dayOfWeek: DayOfWeek!
  endHour: String
  id: ID!
  isOpen24h: Boolean!
  startHour: String
}