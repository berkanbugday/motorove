<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorove - Şifre Güncelleme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white !important;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .email-container {
            max-width: 600px;
            width: 100%;
            background-color: white !important;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 200px;
        }
        
        .divider {
            border-top: 1px solid #ddd !important;
            margin: 20px 0;
        }
        
        .content-card {
            background-color: #F5F5F7 !important;
            padding: 30px;
            text-align: center;
            border-radius: 5px;
        }
        
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        p {
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .button {
            display: inline-block;
            background-color: #121212 !important;
            color: white !important;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 200px;
            margin-top: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        
        .logo-img {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }
        
        .logo-text {
            font-weight: bold;
            font-size: 28px;
            display: block;
            margin-top: 5px;
        }
        
        .logo-subtext {
            font-size: 12px;
            letter-spacing: 1px;
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
            color: #666;
        }
        
        /* Eye icon styles */
        .eye-icon {
            width: 20px;
            height: 20px;
        }
    </style>
    <script>
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMessage = document.getElementById('passwordError');
            
            if (password.length < 6) {
                errorMessage.textContent = 'Şifre en az 6 karakter olmalıdır.';
                errorMessage.style.display = 'block';
                return false;
            }
            
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Şifreler eşleşmiyor.';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // Add token from URL to form data
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');
            
            if (!token || !email) {
                errorMessage.textContent = 'Geçersiz veya eksik token veya email.';
                errorMessage.style.display = 'block';
                return false;
            }
            
            document.getElementById('token').value = token;
            document.getElementById('email').value = email;
            
            return true;
        }
        
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const eyeIcon = document.getElementById(inputId + 'Eye');
            
            if (input.type === 'password') {
                input.type = 'text';
                // Show eye icon when password is visible
                eyeIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" class="eye-icon"><path d="M572.52 241.4C518.29 135.59 410.93 64 288 64S57.68 135.64 3.48 241.41a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.32-71.64 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400a144 144 0 1 1 144-144 143.93 143.93 0 0 1-144 144zm0-240a95.31 95.31 0 0 0-25.31 3.79 47.85 47.85 0 0 1-66.9 66.9A95.78 95.78 0 1 0 288 160z"/></svg>';
            } else {
                input.type = 'password';
                // Show eye-slash icon when password is hidden
                eyeIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" class="eye-icon"><path d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z"/></svg>';
            }
        }
    </script>
    <script>
        // Check for token and email parameters when page loads
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');
            
            // Redirect to motorove.app if token or email is missing
            if (!token || !email) {
                window.location.href = 'https://motorove.app';
            }
        });
    </script>
</head>
<body>
    <div class="email-container">
        <div class="logo-container">
            <img src="https://ddyewqahpibiuvfzfnye.supabase.co/storage/v1/object/sign/images/logo/motorove_logo_dark.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9lN2M4YTljYS0xZjhhLTRkMWItYTVjOS1lMWJmNjFlZjhhZGYiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbWFnZXMvbG9nby9tb3Rvcm92ZV9sb2dvX2RhcmsucG5nIiwiaWF0IjoxNzUxMzc0ODczLCJleHAiOjIwNjY3MzQ4NzN9.bUtX2EmMjHMtEYH1iMojk9sf3S25TeAwohyOxteY28A" alt="Motorove Logo" class="logo-img">
            <span class="logo-text">Motorove</span>
            <span class="logo-subtext">Motosiklet Uygulaması</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="content-card">
            <h1>ŞİFRENİZİ GÜNCELLEYİN</h1>
            <p>Lütfen hesabınız için yeni bir şifre belirleyin.</p>
            
                         <form id="updatePasswordForm" action="{{ .BackendURL }}/auth/update-password" method="POST" onsubmit="return validateForm()">
                <input type="hidden" id="token" name="token" value="">
                <input type="hidden" id="email" name="email" value="">
                
                <div class="form-group">
                    <label for="password">Yeni Şifre</label>
                    <input type="password" id="password" name="password" minlength="6" required>
                    <span class="password-toggle" id="passwordEye" onclick="togglePasswordVisibility('password')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" class="eye-icon">
                            <path d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z"/>
                        </svg>
                    </span>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Şifre Tekrar</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <span class="password-toggle" id="confirmPasswordEye" onclick="togglePasswordVisibility('confirmPassword')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" class="eye-icon">
                            <path d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z"/>
                        </svg>
                    </span>
                </div>
                
                <div id="passwordError" class="error-message"></div>
                <div id="serverError" class="error-message"></div>
                
                <button type="submit" class="button">Şifremi Güncelle</button>
            </form>
            
            <script>
                // Add response handling for the form submission
                document.getElementById('updatePasswordForm').addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    if (!validateForm()) {
                        return false;
                    }
                    
                    const form = this;
                    const serverError = document.getElementById('serverError');
                    
                    try {
                        const response = await fetch(form.action, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                email: document.getElementById('email').value,
                                token: document.getElementById('token').value,
                                password: document.getElementById('password').value
                            })
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            // Success - redirect to success page or show success message
                            form.innerHTML = '<div style="text-align: center;"><h2>Şifreniz Başarıyla Güncellendi</h2>' +
                                '<p>Şifreniz başarıyla güncellenmiştir. Artık yeni şifreniz ile giriş yapabilirsiniz.</p>' +
                                '<a href="motorove://login" class="button">Giriş Yap</a></div>';
                        } else {
                            serverError.textContent = result.message || 'Şifre güncellenirken bir hata oluştu.';
                            serverError.style.display = 'block';
                        }
                    } catch (error) {
                        serverError.textContent = 'Sunucuya bağlanırken bir hata oluştu.';
                        serverError.style.display = 'block';
                    }
                    
                    return false;
                });
            </script>
        </div>
        
        <div class="divider"></div>
    </div>
</body>
</html>
