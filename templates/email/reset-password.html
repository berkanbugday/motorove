<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorove - Şifre Sıfırlama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white !important;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .email-container {
            max-width: 600px;
            width: 100%;
            background-color: white !important;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 200px;
        }
        
        .divider {
            border-top: 1px solid #ddd !important;
            margin: 20px 0;
        }
        
        .content-card {
            background-color: #F5F5F7 !important;
            padding: 30px;
            text-align: center;
            border-radius: 5px;
        }
        
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        p {
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .button {
            display: inline-block;
            background-color: #121212 !important;
            color: white !important;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 200px;
            margin-top: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        
        .logo-img {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }
        
        .logo-text {
            font-weight: bold;
            font-size: 28px;
            display: block;
            margin-top: 5px;
        }
        
        .logo-subtext {
            font-size: 12px;
            letter-spacing: 1px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="logo-container">
            <img src="https://tfqnrpmygwmfqksfemhw.supabase.co/storage/v1/object/public/images/motorove_logo_dark.png" alt="Motorove Logo" class="logo-img">
            <span class="logo-text">Motorove</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="content-card">
            <h1>ŞİFRENİZİ SIFIRLAYIN</h1>
            <p>Merhaba, şifre sıfırlama talebinde bulundunuz.</p>
            <p>Yeni bir şifre belirlemek ve hesabınıza erişim sağlamak için aşağıdaki butona tıklayın.</p>
            <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery" class="button">Şifremi Sıfırla</a>
        </div>
        
        <div class="divider"></div>
    </div>
</body>
</html>
