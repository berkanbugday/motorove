<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorove - E-posta Doğrulama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white !important;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .email-container {
            max-width: 600px;
            width: 100%;
            background-color: white !important;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 200px;
        }
        
        .divider {
            border-top: 1px solid #ddd !important;
            margin: 20px 0;
        }
        
        .content-card {
            background-color: #F5F5F7 !important;
            padding: 30px;
            text-align: center;
            border-radius: 5px;
        }
        
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        p {
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .button {
            display: inline-block;
            background-color: #121212 !important;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 200px;
            margin-top: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        
        .logo-img {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }
        
        .logo-text {
            font-weight: bold;
            font-size: 28px;
            display: block;
            margin-top: 5px;
        }
        
        .logo-subtext {
            font-size: 12px;
            letter-spacing: 1px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="logo-container">
            <img src="https://ddyewqahpibiuvfzfnye.supabase.co/storage/v1/object/sign/images/logo/motorove_logo_dark.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9lN2M4YTljYS0xZjhhLTRkMWItYTVjOS1lMWJmNjFlZjhhZGYiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbWFnZXMvbG9nby9tb3Rvcm92ZV9sb2dvX2RhcmsucG5nIiwiaWF0IjoxNzUxMzc0ODczLCJleHAiOjIwNjY3MzQ4NzN9.bUtX2EmMjHMtEYH1iMojk9sf3S25TeAwohyOxteY28A" alt="Motorove Logo" class="logo-img">
            <span class="logo-text">Motorove</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="content-card">
            <h1>HOŞ GELDİNİZ!</h1>
            <p>Merhaba, motorcu topluluğumuza katıldığınız için teşekkürler! Artık Motorove topluluğunun bir parçasısınız.</p>
            <p>Hesabınızı aktifleştirmek ve tüm özelliklere erişmek için lütfen e-posta adresinizi doğrulayın.</p>
            <a href="{{ .ConfirmationURL }}" class="button">E-Postamı Doğrula</a>
        </div>
        
        <div class="divider"></div>
    </div>
</body>
</html>
